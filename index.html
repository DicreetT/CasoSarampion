<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Código Sarampión</title>
    <meta
      name="description"
      content="Simulador educativo de sarampión para clase médica de 5º curso."
    />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, proxy-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(16, 185, 129, 0.18), transparent 32%),
          linear-gradient(180deg, #02070b 0%, #08111b 100%);
        color: #d7fbe6;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        min-height: 100vh;
      }

      #root {
        min-height: 100vh;
      }

      .bootScreen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        background:
          radial-gradient(circle at center, rgba(45, 212, 191, 0.08), transparent 42%),
          linear-gradient(180deg, rgba(2, 7, 11, 0.96), rgba(8, 17, 27, 0.98));
      }

      .bootCard {
        max-width: 520px;
        width: 100%;
        border-radius: 28px;
        border: 1px solid rgba(45, 212, 191, 0.26);
        background: rgba(2, 8, 12, 0.88);
        box-shadow:
          0 0 0 1px rgba(59, 130, 246, 0.12),
          0 24px 80px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(16px);
        padding: 28px 24px;
      }

      .bootTitle {
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .bootSubtitle {
        margin: 12px 0 0;
        color: #9be8c4;
        font-size: 1rem;
        line-height: 1.5;
      }

      .bootHint {
        margin: 18px 0 0;
        color: #7dd3fc;
        font-size: 0.95rem;
      }

      .bootPulse {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 999px;
        border: 2px solid rgba(34, 197, 94, 0.5);
        box-shadow: 0 0 28px rgba(34, 197, 94, 0.3);
        display: grid;
        place-items: center;
        position: relative;
      }

      .bootPulse::after {
        content: "";
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background: #4ade80;
        box-shadow: 0 0 24px rgba(74, 222, 128, 0.9);
        animation: bootPulse 1.3s ease-in-out infinite;
      }

      @keyframes bootPulse {
        0%,
        100% {
          transform: scale(0.85);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="bootScreen">
        <div class="bootCard">
          <div class="bootPulse" aria-hidden="true"></div>
          <h1 class="bootTitle">Código Sarampión</h1>
          <p class="bootSubtitle">
            Simulador clínico de sarampión cargando.
          </p>
          <p class="bootHint">
            Si ves esta pantalla demasiado tiempo, haz un hard refresh en la página.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
